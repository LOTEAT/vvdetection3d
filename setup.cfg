[yapf]
based_on_style = pep8
blank_line_before_nested_class_or_def = true
split_before_expression_after_opening_paren = true

[isort]
line_length = 79
multi_line_output = 0
extra_standard_library = setuptools
known_first_party = vvdet3d
known_third_party = cv2,imageio,lyft_dataset_sdk,matplotlib,mmcv,mmdet,mmengine,numba,numpy,nuscenes,open3d,plyfile,pyquaternion,pytest,scipy,shapely,skimage,terminaltables,torch,trimesh
no_lines_before = STDLIB,LOCALFOLDER
default_section = THIRDPARTY

[codespell]
ignore-words-list = ans,crate,hist,formating,dout,wan,nd,fo,avod,warmup
